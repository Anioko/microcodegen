name: Publish archiet-microcodegen to PyPI

# Triggered on a git tag of the form v*.*.* (e.g. v0.1.0).
# Builds the wheel + sdist for archiet-microcodegen and uploads them to PyPI.
#
# Founder setup (one-time):
#   1. Create a PyPI API token at https://pypi.org/manage/account/token/
#      (scope: "Entire account" for first publish; tighten to project after)
#   2. Add it to this repo's secrets as PYPI_API_TOKEN_MICROCODEGEN
#   3. Tag a release: git tag v0.1.0 && git push origin v0.1.0
#
# Without PYPI_API_TOKEN_MICROCODEGEN set, the workflow fails loudly with a clear message
# before attempting any build work.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — do NOT upload to PyPI"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify PYPI_API_TOKEN_MICROCODEGEN is set (fail loud if missing)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PYPI_API_TOKEN_MICROCODEGEN: ${{ secrets.PYPI_API_TOKEN_MICROCODEGEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN_MICROCODEGEN" ]; then
            echo "::error::PYPI_API_TOKEN_MICROCODEGEN secret is not set." >&2
            echo "" >&2
            echo "Add it at: https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions/new" >&2
            echo "Generate a token at: https://pypi.org/manage/account/token/" >&2
            exit 1
          fi
          echo "PYPI_API_TOKEN_MICROCODEGEN present (length: ${#PYPI_API_TOKEN_MICROCODEGEN})"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Sanity-check microcodegen.py is unchanged in shape
        # The package wraps scripts/microcodegen.py — if it's gone or moved
        # the build will silently ship a broken wheel. Fail early instead.
        run: |
          test -f scripts/microcodegen.py
          python -c "import ast; ast.parse(open('scripts/microcodegen.py').read())"
          echo "scripts/microcodegen.py parses cleanly."

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify wheel contains _core.py with the algorithm
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          python -m zipfile -l "$WHEEL" | grep -E "_core\.py" || {
            echo "::error::Wheel is missing archiet_microcodegen/_core.py" >&2
            exit 1
          }
          # Unpack and assert the algorithm symbols are present.
          mkdir -p _wheel_check
          python -m zipfile -e "$WHEEL" _wheel_check
          grep -q "def microcodegen" _wheel_check/archiet_microcodegen/_core.py
          grep -q "def parse_prd" _wheel_check/archiet_microcodegen/_core.py
          grep -q "def render_genome" _wheel_check/archiet_microcodegen/_core.py
          echo "Wheel contents verified."

      - name: Twine check (metadata + long_description rendering)
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN_MICROCODEGEN }}
          # skip_existing avoids hard-failing on a re-run of the same tag.
          skip-existing: true

      - name: Dry-run notice
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::dry_run=true — wheel built but NOT uploaded to PyPI."
          echo "Artifacts:"
          ls -la dist/

      - name: Upload built artifacts (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 30
